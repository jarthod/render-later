name: Ruby

on:
  push:
    branches: [ "master" ]
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04 # at time of writing ubuntu-latest was still 20.04
    env: # $BUNDLE_GEMFILE must be set at the job level, so it is set for all steps
      BUNDLE_GEMFILE: test/gemfiles/${{ matrix.gemfile }}
    strategy:
      matrix:
        ruby-version: [ '3.2', '3.3', '3.4' ]
        gemfile: [ 'rails-7.1', 'rails-7.2', 'rails-8.0' ]
        include:
          - ruby-version: '2.6'
            gemfile: rails-4.2 # EOL
            bundler: '1.17.3' # requires bundler < 2
          - ruby-version: '2.6'
            gemfile: rails-5.2 # EOL
          - ruby-version: '3.0'
            gemfile: rails-6.1 # EOL
          - ruby-version: '3.1'
            gemfile: rails-7.0
          - ruby-version: '3.4'
            gemfile: rails-main

    steps:
    - uses: actions/checkout@v3
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true # runs 'bundle install' and caches installed gems automatically
        bundler: ${{ matrix.bundler }}
    - name: Run tests
      run: bundle exec rake